[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from   = "/api/ai"
  to     = "/.netlify/functions/ai-proxy"
  status = 200

[[redirects]]
  from   = "/api/claude"
  to     = "/.netlify/functions/claude"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
